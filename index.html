<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A lightweight WYSIWYG rich text editor built with vanilla JavaScript.">
	<title>WYSIWYG Editor</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="editor-wrapper">
		<div id="toolbar">
			<button id="btn-bold" title="Bold" onmousedown="event.preventDefault()" onclick="execCmd('bold');"><i class="fas fa-bold" aria-hidden="true"></i></button>
			<button id="btn-italic" title="Italic" onmousedown="event.preventDefault()" onclick="execCmd('italic');"><i class="fas fa-italic" aria-hidden="true"></i></button>
			<button id="btn-underline" title="Underline" onmousedown="event.preventDefault()" onclick="execCmd('underline');"><i class="fas fa-underline" aria-hidden="true"></i></button>
			<button id="btn-strikeThrough" title="Strikethrough" onmousedown="event.preventDefault()" onclick="execCmd('strikeThrough');"><i class="fas fa-strikethrough" aria-hidden="true"></i></button>
			<button title="Align Left" onmousedown="event.preventDefault()" onclick="execCmd('justifyLeft');"><i class="fas fa-align-left" aria-hidden="true"></i></button>
			<button title="Align Center" onmousedown="event.preventDefault()" onclick="execCmd('justifyCenter');"><i class="fas fa-align-center" aria-hidden="true"></i></button>
			<button title="Align Right" onmousedown="event.preventDefault()" onclick="execCmd('justifyRight');"><i class="fas fa-align-right" aria-hidden="true"></i></button>
			<button title="Justify" onmousedown="event.preventDefault()" onclick="execCmd('justifyFull');"><i class="fas fa-align-justify" aria-hidden="true"></i></button>
			<button title="Cut" onmousedown="event.preventDefault()" onclick="cutText();"><i class="fas fa-scissors" aria-hidden="true"></i></button>
			<button title="Copy" onmousedown="event.preventDefault()" onclick="copyText();"><i class="fas fa-copy" aria-hidden="true"></i></button>
			<button title="Paste" onmousedown="event.preventDefault()" onclick="pasteText();"><i class="fas fa-paste" aria-hidden="true"></i></button>
			<button title="Indent" onmousedown="event.preventDefault()" onclick="execCmd('indent');"><i class="fas fa-indent" aria-hidden="true"></i></button>
			<button title="Outdent" onmousedown="event.preventDefault()" onclick="execCmd('outdent');"><i class="fas fa-outdent" aria-hidden="true"></i></button>
			<button title="Subscript" onmousedown="event.preventDefault()" onclick="execCmd('subscript');"><i class="fas fa-subscript" aria-hidden="true"></i></button>
			<button title="Superscript" onmousedown="event.preventDefault()" onclick="execCmd('superscript');"><i class="fas fa-superscript" aria-hidden="true"></i></button>
			<button title="Undo" onmousedown="event.preventDefault()" onclick="execCmd('undo');"><i class="fas fa-rotate-left" aria-hidden="true"></i></button>
			<button title="Redo" onmousedown="event.preventDefault()" onclick="execCmd('redo');"><i class="fas fa-rotate-right" aria-hidden="true"></i></button>
			<button title="Bullet List" onmousedown="event.preventDefault()" onclick="execCmd('insertUnorderedList');"><i class="fas fa-list-ul" aria-hidden="true"></i></button>
			<button title="Numbered List" onmousedown="event.preventDefault()" onclick="execCmd('insertOrderedList');"><i class="fas fa-list-ol" aria-hidden="true"></i></button>
			<select title="Heading" onchange="if(this.value) execCommandWithArg('formatBlock', this.value); this.selectedIndex = 0;">
				<option value="">Heading</option>
				<option value="H1">H1</option>
				<option value="H2">H2</option>
				<option value="H3">H3</option>
				<option value="H4">H4</option>
				<option value="H5">H5</option>
				<option value="H6">H6</option>
			</select>
			<button title="Horizontal Rule" onmousedown="event.preventDefault()" onclick="execCmd('insertHorizontalRule');">HR</button>
			<button title="Insert Link" onmousedown="event.preventDefault()" onclick="openUrlBar('link');"><i class="fas fa-link" aria-hidden="true"></i></button>
			<button title="Remove Link" onmousedown="event.preventDefault()" onclick="execCmd('unlink');"><i class="fas fa-link-slash" aria-hidden="true"></i></button>
			<button title="Clear Formatting" onmousedown="event.preventDefault()" onclick="execCmd('removeFormat');"><i class="fas fa-eraser" aria-hidden="true"></i></button>
			<button title="Toggle Source HTML" onmousedown="event.preventDefault()" onclick="toggleSource();"><i class="fas fa-code" aria-hidden="true"></i></button>
			<button id="btn-toggle-edit" title="Toggle Edit Mode" onmousedown="event.preventDefault()" onclick="toggleEdit();" class="active">Editing: ON</button>
			<button title="Print" onmousedown="event.preventDefault()" onclick="window.print();"><i class="fas fa-print" aria-hidden="true"></i></button>
			<button title="Export as HTML" onmousedown="event.preventDefault()" onclick="exportHTML();"><i class="fas fa-download" aria-hidden="true"></i></button>
			<br>
			<select title="Font Family" onchange="if(this.value) execCommandWithArg('fontName', this.value); this.selectedIndex = 0;">
				<option value="">Font</option>
				<option value="Arial">Arial</option>
				<option value="Comic Sans MS">Comic Sans MS</option>
				<option value="Courier">Courier</option>
				<option value="Georgia">Georgia</option>
				<option value="Tahoma">Tahoma</option>
				<option value="Times New Roman">Times New Roman</option>
				<option value="Verdana">Verdana</option>
			</select>
			<select title="Font Size" onchange="if(this.value) execCommandWithArg('fontSize', this.value); this.selectedIndex = 0;">
				<option value="">Size</option>
				<option value="1">Tiny</option>
				<option value="2">Small</option>
				<option value="3">Normal</option>
				<option value="4">Medium</option>
				<option value="5">Large</option>
				<option value="6">X-Large</option>
				<option value="7">Huge</option>
			</select>
			<label>Fore color:<input type="color" oninput="execCommandWithArg('foreColor', this.value);" /></label>
			<label>Background color:<input type="color" oninput="execCommandWithArg('hiliteColor', this.value);" /></label>
			<button title="Insert Image" onmousedown="event.preventDefault()" onclick="openUrlBar('image');"><i class="fas fa-image" aria-hidden="true"></i></button>
			<button title="Select All" onmousedown="event.preventDefault()" onclick="execCmd('selectAll');">Select All</button>
			<button title="Clear All" onmousedown="event.preventDefault()" onclick="clearAll();">Clear All</button>
		</div>
		<div id="url-bar" style="display:none;">
			<input type="text" id="url-input" placeholder="https://" />
			<button onclick="confirmUrl();">Insert</button>
			<button onclick="closeUrlBar();">Cancel</button>
			<span id="url-error" style="color:#c0392b;font-size:13px;display:none;"></span>
		</div>
		<div id="editor" contenteditable="true"></div>
	</div>
	<script src="editor.js"></script>
</body>
</html>
